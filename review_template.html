<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Review</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaed;
    --text-dim: #9aa2b1;
    --accent: #5b8cff;
    --good: #38c172;
    --warn: #f2b134;
    --bad: #e0546a;
    --mono: "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
    padding-bottom: 60px;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px; }

  /* ---------- Hero ---------- */
  .hero {
    background: linear-gradient(145deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 28px 24px;
    margin-bottom: 24px;
  }
  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }
  .hero-title { font-size: 22px; font-weight: 650; margin: 0 0 4px; }
  .hero-meta { color: var(--text-dim); font-size: 13px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13px;
    white-space: nowrap;
  }
  .badge-strong_no, .badge-no { background: rgba(224,84,106,0.15); color: var(--bad); border: 1px solid rgba(224,84,106,0.35); }
  .badge-borderline { background: rgba(242,177,52,0.15); color: var(--warn); border: 1px solid rgba(242,177,52,0.35); }
  .badge-yes, .badge-strong_yes { background: rgba(56,193,114,0.15); color: var(--good); border: 1px solid rgba(56,193,114,0.35); }

  .verdict {
    margin-top: 16px;
    font-size: 17px;
    font-weight: 500;
    padding: 14px 16px;
    background: rgba(91,140,255,0.08);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
  }

  .rings {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 22px;
  }
  .ring-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
  }
  .ring-card svg { display: block; margin: 0 auto; }
  .ring-label { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
  .ring-score { font-size: 20px; font-weight: 700; }

  /* ---------- Section cards ---------- */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }
  @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } .rings { grid-template-columns: repeat(2, 1fr); } }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 0 0 14px;
  }
  .fix-item {
    display: flex; gap: 12px; margin-bottom: 14px; align-items: flex-start;
  }
  .fix-num {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(224,84,106,0.15); color: var(--bad);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; border: 1px solid rgba(224,84,106,0.35);
  }
  .fix-headline { font-weight: 600; margin-bottom: 2px; }
  .fix-detail { color: var(--text-dim); font-size: 14px; }

  .good-list { list-style: none; padding: 0; margin: 0; }
  .good-list li {
    padding-left: 26px; position: relative; margin-bottom: 10px; font-size: 14px; color: var(--text);
  }
  .good-list li::before {
    content: "✓"; position: absolute; left: 0; color: var(--good); font-weight: 700;
  }

  /* ---------- Timeline ---------- */
  .timeline-wrap { overflow-x: auto; }
  .timeline-track {
    position: relative;
    height: 46px;
    background: var(--panel-2);
    border-radius: 8px;
    border: 1px solid var(--border);
    min-width: 480px;
  }
  .tl-silence {
    position: absolute; top: 0; bottom: 0;
    background: rgba(224,84,106,0.45);
  }
  .tl-marker {
    position: absolute; top: -22px; transform: translateX(-50%);
    font-size: 10px; color: var(--text-dim); white-space: nowrap;
  }
  .tl-marker::after {
    content: ""; position: absolute; left: 50%; top: 18px;
    width: 2px; height: 8px; background: var(--accent);
  }
  .tl-marker.type-bug::after { background: var(--bad); }
  .tl-marker.type-good::after { background: var(--good); }
  .tl-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-top: 26px; }
  .tl-legend { display: flex; gap: 18px; margin-top: 10px; font-size: 12px; color: var(--text-dim); }
  .tl-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .tl-swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* ---------- Detail sections (accordions) ---------- */
  .detail { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; background: var(--panel); }
  .detail summary {
    cursor: pointer; padding: 16px 20px; font-weight: 600; font-size: 14px;
    display: flex; justify-content: space-between; align-items: center; list-style: none;
  }
  .detail summary::-webkit-details-marker { display: none; }
  .detail summary .chev { color: var(--text-dim); transition: transform 0.15s; }
  .detail[open] summary .chev { transform: rotate(90deg); }
  .detail-score { font-size: 13px; color: var(--text-dim); font-weight: 500; }
  .detail-body { padding: 0 20px 18px; color: var(--text); font-size: 14px; }
  .detail-body p { margin: 0 0 10px; }
  .detail-body code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 13px; }
  .detail-body ul { padding-left: 20px; }

  /* ---------- Code block ---------- */
  pre.code-block {
    background: #0b0d12; border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 1.6;
    margin: 0;
  }
  .code-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }

  /* ---------- Rewrite comparison ---------- */
  .rewrite-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .rewrite-grid { grid-template-columns: 1fr; } }
  .rewrite-col { border-radius: 10px; padding: 14px; font-size: 13.5px; }
  .rewrite-before { background: rgba(224,84,106,0.08); border: 1px solid rgba(224,84,106,0.25); }
  .rewrite-after { background: rgba(56,193,114,0.08); border: 1px solid rgba(56,193,114,0.25); }
  .rewrite-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 8px; font-weight: 700; }

  .footer-note { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 30px; }

  /* ---------- Nav bar ---------- */
  .nav-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .nav-bar a {
    color: var(--text-dim); text-decoration: none; font-size: 13px;
    padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); transition: color 0.15s, border-color 0.15s;
    display: inline-flex; align-items: center; gap: 6px; max-width: 320px;
  }
  .nav-bar a span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-bar a:hover { color: var(--text); border-color: var(--accent); }
  .nav-bar .nav-all { font-weight: 600; color: var(--text); }
  .nav-bar .nav-spacer { flex: 1 1 auto; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script id="review-data" type="application/json">
/*__REVIEW_DATA__*/
</script>

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('review-data').textContent);
  const app = document.getElementById('app');

  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'html') e.innerHTML = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(c => c && e.appendChild(c));
    return e;
  }

  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function scoreColor(score) {
    if (score >= 7) return getComputedStyle(document.documentElement).getPropertyValue('--good');
    if (score >= 5) return getComputedStyle(document.documentElement).getPropertyValue('--warn');
    return getComputedStyle(document.documentElement).getPropertyValue('--bad');
  }

  function ring(score, label) {
    const r = 30, c = 2 * Math.PI * r;
    const pct = Math.max(0, Math.min(10, score)) / 10;
    const color = scoreColor(score);
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', 76); svg.setAttribute('height', 76); svg.setAttribute('viewBox', '0 0 76 76');
    const bg = document.createElementNS(svgNS, 'circle');
    bg.setAttribute('cx', 38); bg.setAttribute('cy', 38); bg.setAttribute('r', r);
    bg.setAttribute('fill', 'none'); bg.setAttribute('stroke', '#2a2f3a'); bg.setAttribute('stroke-width', 8);
    const fg = document.createElementNS(svgNS, 'circle');
    fg.setAttribute('cx', 38); fg.setAttribute('cy', 38); fg.setAttribute('r', r);
    fg.setAttribute('fill', 'none'); fg.setAttribute('stroke', color); fg.setAttribute('stroke-width', 8);
    fg.setAttribute('stroke-dasharray', c);
    fg.setAttribute('stroke-dashoffset', c * (1 - pct));
    fg.setAttribute('stroke-linecap', 'round');
    fg.setAttribute('transform', 'rotate(-90 38 38)');
    const txt = document.createElementNS(svgNS, 'text');
    txt.setAttribute('x', 38); txt.setAttribute('y', 44); txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('font-size', '18'); txt.setAttribute('font-weight', '700'); txt.setAttribute('fill', '#e8eaed');
    txt.textContent = score;
    svg.appendChild(bg); svg.appendChild(fg); svg.appendChild(txt);

    return el('div', { class: 'ring-card' }, [
      svg,
      el('div', { class: 'ring-label', text: label }),
    ]);
  }

  // ---------- Nav bar ----------
  if (DATA._nav) {
    const nav = DATA._nav;
    const bar = el('div', { class: 'nav-bar' });
    bar.appendChild(el('a', { class: 'nav-all', href: nav.index_uri }, [document.createTextNode('☰ All Reviews')]));
    if (nav.prev) {
      bar.appendChild(el('a', { href: nav.prev.uri, title: nav.prev.title }, [
        document.createTextNode('‹ '),
        el('span', { class: 't', text: nav.prev.title }),
      ]));
    } else {
      bar.appendChild(el('span', { class: 'nav-spacer' }));
    }
    bar.appendChild(el('span', { class: 'nav-spacer' }));
    if (nav.next) {
      bar.appendChild(el('a', { href: nav.next.uri, title: nav.next.title }, [
        el('span', { class: 't', text: nav.next.title }),
        document.createTextNode(' ›'),
      ]));
    }
    app.appendChild(bar);
  }

  // ---------- Hero ----------
  const badgeLabel = {
    strong_no: 'Strong No', no: 'No Hire', borderline: 'Borderline',
    yes: 'Hire', strong_yes: 'Strong Hire',
  }[DATA.hire_signal] || DATA.hire_signal || '';

  const hero = el('div', { class: 'hero' }, [
    el('div', { class: 'hero-top' }, [
      el('div', {}, [
        el('h1', { class: 'hero-title', text: DATA.title || 'Interview Review' }),
        el('div', { class: 'hero-meta', text: 'Session length: ' + (DATA.session_length_label || fmtClock(DATA.session_length_sec || 0)) }),
      ]),
      DATA.hire_signal ? el('span', { class: 'badge badge-' + DATA.hire_signal, text: badgeLabel }) : null,
    ]),
    DATA.verdict ? el('div', { class: 'verdict', text: DATA.verdict }) : null,
    el('div', { class: 'rings' }, [
      ring(DATA.scores.explanation_quality, 'Explanation'),
      ring(DATA.scores.speaking_efficiency, 'Speaking'),
      ring(DATA.scores.coding_style, 'Coding style'),
      ring(DATA.scores.correctness, 'Correctness'),
    ]),
  ]);
  app.appendChild(hero);

  // ---------- Top fixes / What was good ----------
  const grid = el('div', { class: 'grid-2' });
  const fixesCard = el('div', { class: 'card' }, [
    el('h2', { text: 'Fix these first' }),
  ]);
  (DATA.top_fixes || []).forEach((f, i) => {
    fixesCard.appendChild(el('div', { class: 'fix-item' }, [
      el('div', { class: 'fix-num', text: String(i + 1) }),
      el('div', {}, [
        el('div', { class: 'fix-headline', text: f.headline }),
        el('div', { class: 'fix-detail', text: f.detail }),
      ]),
    ]));
  });
  grid.appendChild(fixesCard);

  const goodCard = el('div', { class: 'card' }, [
    el('h2', { text: 'What was actually good' }),
  ]);
  const goodList = el('ul', { class: 'good-list' });
  (DATA.what_was_good || []).forEach(g => goodList.appendChild(el('li', { text: g })));
  goodCard.appendChild(goodList);
  grid.appendChild(goodCard);
  app.appendChild(grid);

  // ---------- Timeline ----------
  if (DATA.session_length_sec) {
    const total = DATA.session_length_sec;
    const tlCard = el('div', { class: 'card' }, [ el('h2', { text: 'Session timeline' }) ]);
    const timelineWrap = el('div', { class: 'timeline-wrap' });
    const track = el('div', { class: 'timeline-track' });

    (DATA.silences || []).forEach(s => {
      const leftPct = (s.start_sec / total) * 100;
      const widthPct = Math.max(0.4, ((s.end_sec - s.start_sec) / total) * 100);
      track.appendChild(el('div', {
        class: 'tl-silence',
        style: `left:${leftPct}%; width:${widthPct}%;`,
      }));
    });

    (DATA.key_moments || []).forEach(m => {
      const leftPct = (m.time_sec / total) * 100;
      track.appendChild(el('div', {
        class: 'tl-marker type-' + (m.type || 'info'),
        style: `left:${leftPct}%;`,
        text: m.label,
      }));
    });

    timelineWrap.appendChild(track);
    tlCard.appendChild(timelineWrap);
    tlCard.appendChild(el('div', { class: 'tl-axis' }, [
      el('span', { text: '0:00' }),
      el('span', { text: fmtClock(total) }),
    ]));
    tlCard.appendChild(el('div', { class: 'tl-legend' }, [
      el('span', {}, [el('span', { class: 'tl-swatch', style: 'background:rgba(224,84,106,0.45)' }), document.createTextNode('Silence / dead air')]),
      el('span', {}, [el('span', { class: 'tl-swatch', style: 'background:#5b8cff' }), document.createTextNode('Key moment')]),
      el('span', {}, [el('span', { class: 'tl-swatch', style: 'background:#e0546a' }), document.createTextNode('Bug introduced/found')]),
    ]));
    app.appendChild(tlCard);
  }

  // ---------- Detail sections ----------
  const sectionOrder = [
    ['explanation_quality', 'Explanation quality'],
    ['speaking_efficiency', 'Speaking efficiency'],
    ['coding_style', 'Coding style'],
    ['correctness', 'Correctness & approach'],
  ];
  const sectionsCard = el('div', {}, []);
  sectionOrder.forEach(([key, label], idx) => {
    const sec = (DATA.sections || {})[key];
    if (!sec) return;
    const details = el('details', { class: 'detail' }, [
      el('summary', {}, [
        el('span', {}, [
          document.createTextNode(label + ' '),
          el('span', { class: 'detail-score', text: '— ' + sec.score + '/10' }),
        ]),
        el('span', { class: 'chev', text: '›' }),
      ]),
      el('div', { class: 'detail-body', html: sec.body_html || '' }),
    ]);
    if (idx === 0) details.setAttribute('open', '');
    sectionsCard.appendChild(details);
  });
  app.appendChild(sectionsCard);

  // ---------- Final code ----------
  if (DATA.final_code && DATA.final_code.code) {
    const codeCard = el('div', { class: 'card' }, [
      el('h2', { text: 'Final code' }),
      el('div', { class: 'code-meta', text: DATA.final_code.frame_time ? ('Captured at ' + DATA.final_code.frame_time) : '' }),
      el('pre', { class: 'code-block' }, [el('code', { text: DATA.final_code.code })]),
    ]);
    app.appendChild(codeCard);
  }

  // ---------- Rewritten explanation ----------
  if (DATA.rewritten_explanation) {
    const r = DATA.rewritten_explanation;
    const rewriteCard = el('div', { class: 'card' }, [
      el('h2', { text: 'Rewritten explanation' + (r.weak_moment_time ? ' — weakest moment at ' + r.weak_moment_time : '') }),
      el('div', { class: 'rewrite-grid' }, [
        el('div', { class: 'rewrite-col rewrite-before' }, [
          el('div', { class: 'rewrite-label', text: 'What was said' }),
          el('div', { text: r.original || '' }),
        ]),
        el('div', { class: 'rewrite-col rewrite-after' }, [
          el('div', { class: 'rewrite-label', text: 'Stronger version' }),
          el('div', { text: r.better || '' }),
        ]),
      ]),
    ]);
    app.appendChild(rewriteCard);
  }

  app.appendChild(el('div', { class: 'footer-note', text: DATA.slug ? ('question: ' + DATA.slug) : '' }));
})();
</script>
</body>
</html>
